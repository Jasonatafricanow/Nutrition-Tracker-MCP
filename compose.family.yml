# Family mode: keep ./private-data outside Git; configure TLS reverse proxy separately.
services:
  nutrition-mcp:
    build: .
    restart: unless-stopped
    environment:
      HOST: 127.0.0.1
      DB_PATH: /data/legacy-single-user.db
      MCP_HTTP_ENABLED: '1'
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: '3457'
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      FAMILY_REGISTRY_PATH: /data/family-users.json
      FAMILY_DATA_DIR: /data/members
      FDC_API_KEY: ${FDC_API_KEY:-}
    ports:
      - '127.0.0.1:3457:3457'
    volumes:
      - ./private-data:/data
