# Compose for a TLS terminator on the SAME host (Caddy/Nginx/Tailscale Serve).
# Does not expose either the Dashboard or MCP directly to the public Internet.
services:
  nutrition-mcp:
    build: .
    restart: unless-stopped
    environment:
      HOST: 127.0.0.1
      DB_PATH: /data/nutrition.db
      NUTRITION_TIME_ZONE: ${NUTRITION_TIME_ZONE:-Asia/Shanghai}
      MCP_HTTP_ENABLED: '1'
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: '3457'
      MCP_HTTP_TOKEN: ${MCP_HTTP_TOKEN:?Set a random bearer secret of at least 32 bytes}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      FDC_API_KEY: ${FDC_API_KEY:-}
    ports:
      - '127.0.0.1:3457:3457'
    volumes:
      - nutrition-data:/data
volumes:
  nutrition-data:
