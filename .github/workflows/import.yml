name: Import packaged source

on:
  push:
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand project archive
        shell: bash
        run: |
          cat .bootstrap/part-* | base64 --decode > /tmp/nutrition-core.tar.xz
          echo "2c10d2975b0e779a7d6f9dc521bca6b1d268c1a9e0b505a7ff772a84898e15a4  /tmp/nutrition-core.tar.xz" | sha256sum -c -
          tar -xJf /tmp/nutrition-core.tar.xz
          test -s engine.js && test -s server.js && test -s package-lock.json
      - name: Commit expanded source
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/import.yml
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: import nutrition engine and tests'
          git push
